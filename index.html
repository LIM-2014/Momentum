<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Momentum</title>
</head>
<body>
    <div id="weather">
        <span id="city">City</span>
        <span id="temp">Weather</span>
    </div>

    <div class="main-content">
        <h1 id="localTime">00:00:00</h1>
        
        <div id="greeting">
            <h2 class="greeting-text">Greeting</h2>
            <form class="nameForm">
                <input type="text" class="nameInput" placeholder="What's your name?">
            </form>
        </div>

        <form id="todoForm">
            <input type="text" id="todoInput" placeholder="Write a to-do and press Enter">
            <ul id="todoList"></ul>
        </form>

        <div class="quote">
            <span id="quote-text">Quote</span>
            <br>
            <span id="quote-author">Author</span>
        </div>
    </div>

    <script src="./js/greeting.js"></script>
    <script src="./js/clock.js"></script>
    <script src="./js/random_bg.js"></script>
    <script src="./js/todos.js"></script>
    <script src="./js/quotes.js"></script>
    <script src="./js/weather.js"></script>
</body>
</html>
